name: Build esp_drv.sys

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WDK via NuGet
        shell: pwsh
        run: |
          Write-Host "Installing Microsoft.Windows.WDK.x64 via nuget..."
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory "$env:TEMP\wdk_nuget" -ExcludeVersion
          
          $nugetKmPath = "$env:TEMP\wdk_nuget\Microsoft.Windows.WDK.x64\build\native"
          $targetKitLib = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\10.0.26100.0\km\x64"
          $targetKitInc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"

          # Создаём директории в Windows Kits, если их нет
          New-Item -ItemType Directory -Force -Path $targetKitLib | Out-Null
          New-Item -ItemType Directory -Force -Path $targetKitInc | Out-Null

          # Копируем библиотеки (включая ntoskrnl.lib) и инклуды ядра в стандартные пути Windows Kits
          Copy-Item -Path "$nugetKmPath\lib\x64\*" -Destination $targetKitLib -Recurse -Force
          Copy-Item -Path "$nugetKmPath\include\*" -Destination $targetKitInc -Recurse -Force

          # Проверка
          if (Test-Path "$targetKitLib\ntoskrnl.lib") {
            Write-Host "SUCCESS: ntoskrnl.lib placed in $targetKitLib"
          } else {
            Write-Error "Failed to place ntoskrnl.lib"
            exit 1
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build driver (Release)
        shell: pwsh
        run: cmake --build build --config Release --target esp_drv

      - name: Upload .sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp_drv-sys
          path: build/esp_drv.sys
          if-no-files-found: warn
