name: Build esp_drv.sys

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup WDK
        uses: eb/setup-wdk@v1

      - name: Verify WDK files
        shell: pwsh
        run: |
          $foundLib = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter "ntoskrnl.lib" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $foundLib) {
            Write-Error "ntoskrnl.lib still not found in Windows Kits directory."
            exit 1
          }
          Write-Host "Found ntoskrnl.lib at: $($foundLib.FullName)"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build driver (Release)
        shell: pwsh
        run: cmake --build build --config Release --target esp_drv

      - name: Upload .sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp_drv-sys
          path: build/esp_drv.sys
          if-no-files-found: warn
