name: Build esp_drv.sys

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK + Windows SDK
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $args = @(
            'modify',
            '--installPath', "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise",
            '--add', 'Microsoft.VisualStudio.Component.WDK',
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100',
            '--quiet', '--norestart', '--nocache'
          )
          Write-Host "Running: $vsInstaller $($args -join ' ')"
          $p = Start-Process -FilePath $vsInstaller -ArgumentList $args -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Write-Error "VS Installer exit code: $($p.ExitCode)"
            exit 1
          }
          Write-Host "WDK installed"

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build driver (Release)
        shell: pwsh
        run: cmake --build build --config Release --target esp_drv

      - name: Upload .sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp_drv-sys
          path: build/Release/esp_drv.sys
          if-no-files-found: error
