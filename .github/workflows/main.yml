name: Build esp_drv.sys

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Install WDK (10.0.26100)
        shell: pwsh
        run: |
          Write-Host "Downloading WDK 10.0.26100.1 installer..."
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2271871"
          $installerPath = "$env:TEMP\wdksetup.exe"
          
          Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath
          
          Write-Host "Installing WDK..."
          $process = Start-Process -FilePath $installerPath -ArgumentList "/features + /q" -Wait -PassThru -NoNewWindow
          
          if ($process.ExitCode -ne 0) {
            Write-Error "WDK installation failed with exit code: $($process.ExitCode)"
            exit 1
          }
          Write-Host "WDK installed successfully."

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Kernel Mode Libraries
        shell: pwsh
        run: |
          $kmLibPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\10.0.26100.0\km\x64\ntoskrnl.lib"
          if (-not (Test-Path $kmLibPath)) {
            Write-Error "CRITICAL: ntoskrnl.lib not found at: $kmLibPath"
            
            # Диагностика: вывод фактически установленных версий SDK/WDK
            Write-Host "Available Kit Lib directories:"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory | Select-Object FullName
            exit 1
          }
          Write-Host "SUCCESS: Found $kmLibPath"

      - name: Configure CMake (driver)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build driver (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --target esp_drv

      - name: Upload .sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp_drv-sys
          path: build/esp_drv.sys
          if-no-files-found: warn
